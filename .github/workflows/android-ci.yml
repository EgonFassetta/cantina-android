name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Prepara la cartella dei risultati
        run: mkdir -p ci-results

      - name: Prova la funzione customer-auth del server (accesso con codice)
        id: server_tests
        continue-on-error: true
        working-directory: server
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee ../ci-results/server-tests.log

      - name: Compila e prova la logica (test automatici)
        id: build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain testCantinaDebugUnitTest assembleCantinaDebug assembleCantinaFake 2>&1 | tee ci-results/build.log

      - name: Verifica la compilazione del file per il Play Store (senza firma)
        id: release_check
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain bundleCantinaRelease assembleCantinaRelease 2>&1 | tee ci-results/release-build.log
          ls -la app/build/outputs/bundle/cantinaRelease/ app/build/outputs/apk/cantina/release/ 2>&1 | tee -a ci-results/release-build.log

      - name: Autoverifica della firma con una chiave temporanea (stessa procedura del flusso Release)
        id: signing_check
        continue-on-error: true
        run: |
          set -o pipefail
          {
            keytool -genkeypair -keystore "$RUNNER_TEMP/prova.jks" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 30 \
              -storepass provaprova123 -keypass provaprova123 -dname "CN=Prova firma" 2>&1 | tail -1
            export KEYSTORE_PATH="$RUNNER_TEMP/prova.jks" KEYSTORE_PASSWORD=provaprova123 KEY_ALIAS=upload KEY_PASSWORD=provaprova123
            ./gradlew --no-daemon --console=plain bundleCantinaRelease assembleCantinaRelease 2>&1 | tail -5
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/cantina/release/app-cantina-release.apk | head -4
            jarsigner -verify app/build/outputs/bundle/cantinaRelease/app-cantina-release.aab | head -3
          } 2>&1 | tee ci-results/signing-selftest.log

      - name: Controlli sul pacchetto per il Play Store (versione Android, permessi, librerie)
        continue-on-error: true
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/cantina/release/*.apk | head -1)
          AAB=$(ls app/build/outputs/bundle/cantinaRelease/*.aab | head -1)
          {
            echo "File: $APK"
            "$AAPT2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission|^application-label:|^application-debuggable|^native-code" 
            echo "--- librerie native nel pacchetto:"
            unzip -l "$APK" | grep -E "lib/" | awk '{print $4}' | sed 's#/[^/]*$##' | sort | uniq -c
            echo "--- dimensioni:"
            ls -l "$APK" "$AAB" | awk '{print $5, $9}'
          } 2>&1 | tee ci-results/package-info.txt

      - name: Verifica che il database sia raggiungibile dal computer di GitHub
        run: |
          curl -s -o /dev/null -w "database wines: HTTP %{http_code}\n" "https://xqhoznbjyoityjtrolzb.supabase.co/rest/v1/wines?select=id&limit=1" -H "apikey: sb_publishable_f_jswE7Sf0BU2hHKkQYuEg_ZT7e1rGh" | tee ci-results/rete-runner.txt
          curl -s "https://xqhoznbjyoityjtrolzb.supabase.co/rest/v1/wines?select=cantina,nome,quantita,disponibile_vendita,immagine_url&order=cantina.asc,nome.asc&limit=1000" -H "apikey: sb_publishable_f_jswE7Sf0BU2hHKkQYuEg_ZT7e1rGh" | python3 ci/catalog-stats.py | tee -a ci-results/rete-runner.txt

      - name: Abilita KVM (emulatore veloce)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Avvia il server simulato (per le prove di accesso con codice e richieste)
        run: |
          nohup node ci/fake-supabase.mjs > ci-results/fake-server.log 2>&1 &
          sleep 2
          curl -s localhost:8787/_state | head -c 200

      - name: Prova l'app sull'emulatore
        id: emulator
        if: steps.build.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,8.8.4.4
          script: bash ci/emulator-test.sh

      - name: Riavvia il server simulato (solo se il telefono virtuale si era bloccato)
        id: restart
        if: always() && steps.emulator.outcome == 'failure'
        run: |
          if [ -f ci-results/emulator-dead.txt ] || adb devices 2>/dev/null | grep -q offline; then
            echo "Il telefono virtuale si era bloccato: ripeto la prova."
            pkill -f fake-supabase.mjs || true
            adb kill-server 2>/dev/null || true
            rm -f ci-results/emulator-dead.txt
            nohup node ci/fake-supabase.mjs > ci-results/fake-server-2.log 2>&1 &
            sleep 2
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "La prova è fallita per un motivo diverso dal blocco del telefono: non la ripeto."
          fi

      - name: Prova l'app sull'emulatore (seconda prova)
        id: emulator2
        if: steps.restart.outputs.retry == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,8.8.4.4
          script: bash ci/emulator-test.sh

      - name: Pubblica l'APK di prova (da installare sul telefono)
        if: steps.emulator.outcome == 'success' || steps.emulator2.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/cantina/debug/app-cantina-debug.apk cantina-prova.apk
          gh release view prova >/dev/null 2>&1 || gh release create prova --prerelease --title "Versione di prova" --notes "APK di prova, aggiornato a ogni modifica. Da installare sul telefono per provare l'app."
          gh release upload prova cantina-prova.apk --clobber

      - name: Pubblica i risultati
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EMU_OUTCOME: ${{ steps.emulator2.outcome == 'success' && 'success (alla seconda prova)' || steps.emulator.outcome }}
          RELEASE_OUTCOME: ${{ steps.release_check.outcome }}
          SIGNING_OUTCOME: ${{ steps.signing_check.outcome }}
          SERVER_TESTS_OUTCOME: ${{ steps.server_tests.outcome }}
        run: bash ci/publish-results.sh
